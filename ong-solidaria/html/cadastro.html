<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
        content="Cadastre-se como voluntário da Solidariedade em Ação.">
  <title>Cadastro | Solidariedade em Ação</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/cadastro.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Solidariedade em Ação</a>

      <nav aria-label="Navegação principal">
        <ul class="nav-list">
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>
          <li>
            <a href="cadastro.html" aria-current="page">
              Seja voluntário
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1>Cadastro de voluntário</h1>

      <form id="volunteer-form">
        <fieldset>
          <legend>Dados pessoais</legend>

          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            minlength="3"
            maxlength="100"
            required
          >

          <label for="cpf">CPF</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
            maxlength="14"
            inputmode="numeric"
            placeholder="000.000.000-00"
            required
          >

          <label for="nascimento">Data de nascimento</label>
          <input
            type="date"
            id="nascimento"
            name="nascimento"
            required
          >

          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          >

          <label for="telefone">Telefone</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
            maxlength="15"
            placeholder="(00) 00000-0000"
            required
          >
        </fieldset>

        <fieldset>
          <legend>Endereço</legend>

          <label for="cep">CEP</label>
          <input
            type="text"
            id="cep"
            name="cep"
            pattern="[0-9]{5}-[0-9]{3}"
            maxlength="9"
            inputmode="numeric"
            placeholder="00000-000"
            required
          >

          <label for="endereco">Endereço</label>
          <input
            type="text"
            id="endereco"
            name="endereco"
            required
          >

          <label for="cidade">Cidade</label>
          <input
            type="text"
            id="cidade"
            name="cidade"
            required
          >

          <label for="estado">Estado</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="SC">Santa Catarina</option>
            <option value="PR">Paraná</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>Participação</legend>

          <label for="area">Área de interesse</label>
          <select id="area" name="area" required>
            <option value="">Selecione</option>
            <option value="educacao">Educação</option>
            <option value="alimentacao">Alimentação</option>
            <option value="eventos">Eventos</option>
            <option value="comunicacao">Comunicação</option>
          </select>

          <label for="mensagem">Como deseja colaborar?</label>
          <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            maxlength="500"
          ></textarea>

          <input type="checkbox" id="termos" name="termos" required>
          <label for="termos">
            Concordo com o tratamento dos meus dados.
          </label>
        </fieldset>

        <button type="submit">Enviar cadastro</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Solidariedade em Ação.</p>
  </footer>
</body>
</html>
